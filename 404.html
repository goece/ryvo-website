<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seite nicht gefunden – RYVO</title><meta name="color-scheme" content="dark light"><link rel="icon" href="/icon.png">
<style>:root{--bg:#07060f;--card:#110f1f;--text:#ecebf5;--muted:#a19fb8;--line:#25223a;--accent:#a274ff;--accent2:#ff5fa2;--todo:#ffcf5c}
@media (prefers-color-scheme:light){:root{--bg:#fbfaff;--card:#fff;--text:#16141f;--muted:#5d5a70;--line:#e6e3f2;--accent:#6d3df0;--accent2:#d6337a;--todo:#a86a00}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
header,main,footer{max-width:760px;margin:0 auto;padding:0 16px}
header{padding-top:20px}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.08em;color:var(--text);text-decoration:none}
.brand img{border-radius:7px}
main{padding-top:24px;padding-bottom:48px}
article h1{font-size:clamp(28px,6vw,38px);line-height:1.15;margin:8px 0 24px}
h2{font-size:21px;margin:36px 0 8px;padding-top:16px;border-top:1px solid var(--line)}
h3{font-size:17px;margin:24px 0 4px}
p,li{color:var(--text)}
ul{padding-left:20px}li{margin:4px 0}
a{color:var(--accent)}
strong{font-weight:650}
code{font:14px ui-monospace,Menlo,monospace}
mark.todo{background:none;color:var(--todo);outline:1px dashed var(--todo);border-radius:4px;padding:0 3px}
.table{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}th{color:var(--muted);font-weight:600}
.hero{text-align:center;padding:12vh 0 8vh}
.hero img{border-radius:26px;box-shadow:0 20px 60px -10px color-mix(in srgb,var(--accent) 55%,transparent)}
.hero h1{font-size:clamp(44px,12vw,72px);letter-spacing:.12em;margin:24px 0 8px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:19px;color:var(--muted);max-width:30em;margin:0 auto}
.soon{display:inline-block;margin-top:28px;padding:8px 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-weight:600}
.contact{color:var(--muted);margin-top:20px}
footer{border-top:1px solid var(--line);padding-top:20px;padding-bottom:40px;color:var(--muted);font-size:14px}
footer nav{display:flex;flex-wrap:wrap;gap:8px 20px}
footer a{color:var(--muted);text-decoration:none}footer a[aria-current]{color:var(--text)}footer a:hover{color:var(--text)}
</style></head>
<body><header><a class="brand" href="/"><img src="/icon.png" alt="" width="28" height="28">RYVO</a></header>
<main><section class="hero"><h1>404</h1><p class="lead">Diese Seite gibt es nicht.</p><p><a href="/">Zur Startseite</a></p></section></main>
<footer><nav><a href="/datenschutz/">Datenschutz</a><a href="/nutzungsbedingungen/">Nutzungsbedingungen</a><a href="/impressum/">Impressum</a><a href="/support/">Support</a></nav><p>© 2026 RYVO</p></footer></body></html>
